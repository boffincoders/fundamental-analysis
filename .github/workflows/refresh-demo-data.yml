name: Refresh demo data

# Nightly: re-fetch the "Try it" companies from SEC EDGAR, commit any changes
# and redeploy the docs site. Needs the repository secret SEC_CONTACT_EMAIL
# (SEC asks every automated request to name a contact).

on:
  schedule:
    - cron: '17 6 * * 1-5' # 06:17 UTC, Monday–Friday
  workflow_dispatch:

permissions:
  contents: write # commit refreshed data
  actions: write  # start the docs deployment

concurrency:
  group: demo-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch from SEC EDGAR
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: node scripts/fetch-demo-data.mjs

      - name: Commit changes
        id: commit
        run: |
          if git diff --quiet -- docs/src/data/demo; then
            echo "No data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/src/data/demo
          git commit -m "chore(demo): refresh SEC data"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so start
      # the docs deployment explicitly.
      - name: Redeploy docs
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-docs.yml --ref "${{ github.ref_name }}"
