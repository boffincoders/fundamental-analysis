<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="630" viewBox="0 0 1000 630" role="img" aria-labelledby="t d">
<title id="t">Every metric, grouped the way analysts read them</title>
<desc id="d">Valuation (analyzeValuation): P/E · P/B · P/S, PEG, EV/EBITDA · EV/Revenue, EV/FCF · Price/Cash flow, Earnings &amp; dividend yield, Graham number, DCF · intrinsic value. Profitability (analyzeProfitability): ROE · ROA · ROIC, Gross margin, Operating margin, Net margin, FCF margin. Liquidity (analyzeLiquidity): Current ratio, Quick ratio, Debt / equity, Interest coverage. Solvency (analyzeSolvency): Net debt · net cash, Net debt / EBITDA, Debt / assets, Interest coverage. Efficiency (analyzeEfficiency): Asset turnover, Inventory turnover, Receivables turnover, DSO · DPO, Cash conversion cycle. Risk (analyzeRisk): Altman Z · Z'', Piotroski F-Score, Sharpe ratio. Quality (analyzeQuality): Payout ratio, Cash conversion, Analyst target upside. Over time (analyzeFundamentalTrends): YoY / QoQ growth, CAGR · median growth, TTM · N-year sums, Quality / value scores.</desc>
<style>

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
