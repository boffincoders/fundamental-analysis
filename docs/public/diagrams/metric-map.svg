<text x="20" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8b9bb4">Each analyzer returns plain numbers, or { value, status, insight } with insights on. Every metric has its own page.</text>
