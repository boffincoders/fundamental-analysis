<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-labelledby="t d">
<title id="t">How the rule-based verdict is formed</title>
<desc id="d">Piotroski's F-Score and Altman's Z'' combine into financial health: both strong reads strong, either weak reads weak, otherwise mixed. Graham's price tests and Lynch's PEG rule combine into price versus classic limits once a share price is entered. Not financial advice.</desc>
<style>

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs><marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b9bb4"/></marker></defs>
<rect width="1000" height="450" rx="14" fill="#0b1220"/>
<rect x="0.5" y="0.5" width="999" height="449" rx="14" fill="none" stroke="#24314d"/>
<text x="20" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#e6edf6">How the rule-based verdict is formed</text>
<text x="20" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#8b9bb4">Four published rule sets, applied mechanically to SEC figures. A summary of what the rules say, not a recommendation.</text>
<g>
<rect x="16" y="84" width="222" height="112" rx="10" fill="#111a2e" stroke="#24314d" stroke-width="1.5"/>
<text x="30" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#e6edf6">Piotroski F-Score</text>
<line x1="28" y1="122" x2="226" y2="122" stroke="#24314d"/>
<text x="30" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#8b9bb4">2000 paper</text><text x="30" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#e6edf6">9 yes/no signals</text><text x="30" y="178" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#e6edf6">7–9 strong · 0–2 weak</text>
</g>
<g>
<rect x="272" y="84" width="222" height="112" rx="10" fill="#111a2e" stroke="#24314d" stroke-width="1.5"/>
<text x="286" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#e6edf6">Altman Z''</text>
<line x1="284" y1="122" x2="482" y2="122" stroke="#24314d"/>
<text x="286" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#8b9bb4">1968 / 1995</text><text x="286" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#e6edf6">distress-risk score</text><text x="286" y="178" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#e6edf6">&gt;2.6 safe · &lt;1.1 distress</text>
</g>
<g>
<rect x="16" y="230" width="222" height="112" rx="10" fill="#111a2e" stroke="#24314d" stroke-width="1.5"/>
<text x="30" y="256" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#e6edf6">Graham price tests</text>
<line x1="28" y1="268" x2="226" y2="268" stroke="#24314d"/>
<text x="30" y="288" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#8b9bb4">Intelligent Investor</text><text x="30" y="306" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#e6edf6">P/E ≤ 15 and</text><text x="30" y="324" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#e6edf6">P/B ≤ 1.5 or P/E×P/B ≤ 22.5</text>
</g>
<g>
<rect x="272" y="230" width="222" height="112" rx="10" fill="#111a2e" stroke="#24314d" stroke-width="1.5"/>
<text x="286" y="256" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#e6edf6">Lynch PEG rule</text>
<line x1="284" y1="268" x2="482" y2="268" stroke="#24314d"/>
<text x="286" y="288" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#8b9bb4">One Up on Wall Street</text><text x="286" y="306" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#e6edf6">PEG ≤ 1 within the rule</text><text x="286" y="324" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#e6edf6">PEG ≥ 2 well above it</text>
</g>
<text x="255" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#8b9bb4">+</text>
<path d="M 497 140 H 542" fill="none" stroke="#8b9bb4" stroke-width="2" marker-end="url(#head)"/>
<text x="255" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#8b9bb4">+</text>
<path d="M 497 286 H 542" fill="none" stroke="#8b9bb4" stroke-width="2" marker-end="url(#head)"/>
<rect x="548" y="84" width="436" height="112" rx="10" fill="#111a2e" stroke="#7ee787" stroke-width="1.5"/>
<text x="564" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#7ee787">Financial health</text>
<text x="564" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#e6edf6">Both strong → strong</text>
<text x="564" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#e6edf6">Either weak → weak</text>
<text x="564" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#e6edf6">Otherwise → mixed</text>
<rect x="548" y="230" width="436" height="112" rx="10" fill="#111a2e" stroke="#f5b544" stroke-width="1.5"/>
<text x="564" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#f5b544">Price vs classic limits</text>
<text x="564" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#e6edf6">Graham passes or PEG ≤ 1 → within</text>
<text x="564" y="306" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#e6edf6">PEG ≥ 2 → well above</text>
<text x="564" y="326" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#e6edf6">Needs a share price you enter</text>
<rect x="16" y="378" width="968" height="52" rx="10" fill="#16223b" stroke="#24314d"/>
<text x="32" y="409" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#e6edf6">Not financial advice. The rules ignore the business, sector norms and your circumstances, and were written for other times and markets.</text>
</svg>
